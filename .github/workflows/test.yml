name: test
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q --junitxml=pytest-report.xml
      - name: Check frontend JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/persistence.js
          node --check web/scanner.js
          node --check web/sessions.js
          node --check web/research.js
          node --check web/strategies.js
          node --check web/product-chrome.js
          node --check web/v4-shell.js
          node --check web/v4-workbench.js
          node --check web/v4-command-center.js
          node --check web/v4-scanner-v2.js
          node --check web/v4-universe.js
          node --check web/v4-final-chrome.js
          node --check web/v4-sitewide.js
          node --check web/v5-chart-workspace.js
      - name: Verify workstation assets
        run: |
          test -s scripts/runtime_smoke.py
          test -s docs/RUNTIME_VALIDATION.md
          test -s docs/TRADINGVIEW_PARITY.md
          test -s docs/SCANNER_V2.md
          test -s web/workstation.css
          test -s web/v4-shell.css
          test -s web/v4-workbench.css
          test -s web/v4-workbench.js
          test -s web/v4-command-center.css
          test -s web/v4-command-center.js
          test -s web/v4-scanner-v2.js
          test -s web/v4-universe.css
          test -s web/v4-universe.js
          test -s web/v4-final-chrome.css
          test -s web/v4-final-chrome.js
          test -s web/v4-sitewide.css
          test -s web/v4-sitewide.js
          test -s web/v4-visual-qa.css
          test -s web/v5-chart-workspace.css
          test -s web/v5-chart-workspace.js
          test -s web/product-pages.css
          test -s web/product-chrome.css
          test -s web/product-chrome.js
          test -s web/product-visual-qa.css
          test -s web/scanner.html
          test -s web/sessions.html
          test -s web/research.html
          test -s web/strategies.html
          test ! -e web/v4-universe-refine.css
          test ! -e web/v4-universe-refine.js
          test ! -e web/v4-universe-safety.css
          test ! -e web/v4-universe-safety.js
          grep -q "execution/accounts" app/main.py
          grep -q 'def sessions_page' app/main.py
          grep -q 'def research_page' app/main.py
          grep -q 'def strategies_page' app/main.py
          grep -q 'market_flow' app/live_intelligence.py
          grep -q 'market_flow_minute' app/market_flow.py
          grep -q "drawingToolbar" web/app.js
          grep -q 'id="sessionRail"' web/index.html
          grep -q 'id="accountSelector"' web/index.html
          grep -q 'Manage presets' web/index.html
          grep -q 'SCANNER' web/index.html
          grep -q 'v4-workbench.js' web/v4-shell.js
          grep -q 'v4-command-center.js' web/v4-shell.js
          grep -q 'v4-scanner-v2.js' web/v4-shell.js
          grep -q 'v4-universe.js' web/v4-shell.js
          grep -q 'v4-final-chrome.js' web/v4-shell.js
          grep -q 'v4-sitewide.js' web/v4-shell.js
          grep -q 'v4-visual-qa.css' web/v4-shell.js
          grep -q 'v5-chart-workspace.js' web/v4-shell.js
          grep -q 'v5-chart-workspace.css' web/v4-shell.js
          ! grep -q 'v4-universe-refine' web/v4-shell.js
          ! grep -q 'v4-universe-safety' web/v4-shell.js
          grep -q 'LIVE UNIVERSE' web/v4-universe.js
          grep -q '/api/live/universe' web/v4-universe.js
          grep -q '/api/live/control' web/v4-universe.js
          grep -q 'product-visual-qa.css' web/scanner.css
          grep -q 'product-visual-qa.css' web/sessions.css
          grep -q 'product-visual-qa.css' web/research.css
          grep -q 'product-visual-qa.css' web/strategies.css
          grep -q 'epinnox.universe.saved.v1' web/research.js
          grep -q 'UNIVERSE CANDIDATES' web/research.html
          grep -q 'href="/sessions"' web/v4-shell.js
          grep -q 'product-chrome.js' web/scanner.html
          grep -q 'product-chrome.js' web/sessions.html
          grep -q 'product-chrome.js' web/research.html
          grep -q 'product-chrome.js' web/strategies.html
          grep -q 'CANDIDATE LEADERBOARD' web/scanner.html
          grep -q 'SESSION REGISTRY' web/sessions.html
          grep -q 'PINNED BACKTESTS' web/research.html
          grep -q 'MODEL CATALOG' web/strategies.html
          grep -q 'chronological holdout' web/scanner.html
          grep -q 'PARITY_SEMANTICS_VERSION' app/indicators.py
      - name: Runtime HTTP smoke test
        run: python scripts/runtime_smoke.py
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ github.run_id }}
          path: pytest-report.xml
          if-no-files-found: warn
