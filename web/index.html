<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Epinnox Terminal</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <div><strong>EPINNOX TERMINAL</strong><span class="muted"> Pine parity lab</span></div>
      <div class="modes"><button class="mode active" data-mode="BACKTEST">BACKTEST</button><button class="mode" data-mode="PAPER">PAPER</button><button class="mode" data-mode="LIVE">LIVE</button></div>
    </header>
    <section class="toolbar">
      <select id="symbol"></select>
      <select id="timeframe"><option>1m</option><option>5m</option><option>15m</option><option>30m</option></select>
      <select id="strategy"></select>
      <select id="direction"><option>Both</option><option>Long Only</option><option>Short Only</option></select>
      <label>Bars <input id="bars" type="number" value="1000" min="100" max="5000" step="100" /></label>
      <label>Balance <input id="balance" type="number" value="100000" step="100" /></label>
      <label>Lev <input id="leverage" type="number" value="1" min="1" max="200" /></label>
      <label>Alloc % <input id="allocation" type="number" value="5" min="0.1" max="100" step="0.1" /></label>
      <label>Pyramid <input id="pyramiding" type="number" value="1" min="1" max="20" /></label>
      <button id="run">Run backtest</button>
    </section>
    <main>
      <section class="chart-panel">
        <div id="chart"></div>
        <div id="indicator"></div>
      </section>
      <aside>
        <h3>Exit engine</h3>
        <label>Entry fee % <input id="entryFee" type="number" value="0.05" step="0.001" /></label>
        <label>Exit fee % <input id="exitFee" type="number" value="0.05" step="0.001" /></label>
        <label>Extra cost % <input id="extraCost" type="number" value="0" step="0.001" /></label>
        <label>Net target % <input id="netTarget" type="number" value="0.01" step="0.001" /></label>
        <label>Referral % <input id="referral" type="number" value="30" step="1" /></label>
        <label>Maint. margin % <input id="maintenance" type="number" value="0.4" step="0.1" /></label>
        <label>Max bars <input id="maxBars" type="number" placeholder="unlimited" /></label>
        <label>Stop % <input id="stopLoss" type="number" placeholder="none" step="0.1" /></label>
        <details><summary>Manual strategy parameters</summary><p class="muted">Leave blank to use the automatic timeframe preset. JSON keys match the active strategy preset.</p><textarea id="manualParams" rows="4" placeholder='{"atr":7,"factor":2.0}'></textarea></details>
        <div id="openPosition" class="open-card"></div>
      </aside>
    </main>
    <section class="tabs">
      <div class="tabbar"><button data-tab="tester" class="active">Strategy Tester</button><button data-tab="trades">List of Trades</button><button data-tab="economics">Economics</button></div>
      <div id="tester" class="tab"></div>
      <div id="trades" class="tab hidden"><div class="table-wrap"><table><thead><tr><th>#</th><th>Side</th><th>Layers</th><th>Entry</th><th>Exit</th><th>Net P&L</th><th>Entry fee</th><th>Exit fee</th><th>Total fee</th><th>Referral</th><th>Lev</th><th>Margin</th><th>MAE</th><th>MFE</th><th>Bars</th><th>Reason</th></tr></thead><tbody id="tradeRows"></tbody></table></div></div>
      <div id="economics" class="tab hidden"></div>
    </section>
    <footer id="status">Ready.</footer>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
